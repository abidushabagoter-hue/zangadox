<!DOCTYPE html>
<html lang="pt-br">
<head>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#000">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ZANGADO - Painel Privado</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #000;
            color: #fff;
            overflow: hidden;
            height: 100vh;
            height: 100dvh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #canvas-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            background: radial-gradient(circle at center, #1a1a1a 0%, #000000 100%);
        }

        .container {
            position: relative;
            z-index: 10;
            width: 90%;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .screen {
            display: none;
            width: 100%;
            flex-direction: column;
            align-items: center;
            animation: fadeIn 0.3s ease forwards;
        }

        .screen.active {
            display: flex;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .title-glow {
            font-size: 2.5rem;
            font-weight: 900;
            letter-spacing: 2px;
            text-align: center;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.8), 0 0 20px rgba(255, 255, 255, 0.4);
            margin-bottom: 5px;
        }

        .subtitle {
            font-size: 0.8rem;
            color: #888;
            letter-spacing: 3px;
            text-transform: uppercase;
            margin-bottom: 30px;
            text-align: center;
        }

        .login-box {
            width: 100%;
            border: 2px solid #fff;
            border-radius: 20px;
            padding: 40px 20px;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            display: flex;
            flex-direction: column;
            align-items: center;
            box-shadow: 0 0 15px rgba(255,255,255,0.1);
        }

        input {
            width: 100%;
            padding: 15px;
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid #333;
            border-radius: 10px;
            color: #fff;
            font-size: 1rem;
            text-align: center;
            outline: none;
            margin-bottom: 20px;
            transition: border 0.3s;
        }

        input:focus {
            border-color: #fff;
        }

        input::placeholder {
            color: #888;
        }

        button {
            width: 100%;
            padding: 15px;
            background: #fff;
            color: #000;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s, background 0.2s;
        }

        button:active {
            transform: scale(0.97);
            background: #ccc;
        }

        .inject-btn {
            width: 100%;
            background: rgba(30, 30, 30, 0.8);
            border: 2px solid #333;
            border-radius: 15px;
            padding: 15px;
            display: flex;
            align-items: center;
            margin-bottom: 15px;
            cursor: pointer;
            transition: border 0.3s, background 0.3s;
        }

        .inject-btn:active {
            background: rgba(50, 50, 50, 0.8);
            border-color: #fff;
        }

        .icon-box {
            width: 50px;
            height: 50px;
            background: #fff;
            border-radius: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: 900;
            color: #000;
            font-size: 1.2rem;
            margin-right: 15px;
            flex-shrink: 0;
        }

        .inject-text {
            display: flex;
            flex-direction: column;
            text-align: left;
            overflow: hidden;
        }

        .inject-text strong {
            font-size: 1rem;
            color: #fff;
            white-space: nowrap;
            text-overflow: ellipsis;
            overflow: hidden;
        }

        .inject-text span {
            font-size: 0.8rem;
            color: #888;
        }

        .btn-outline {
            background: transparent;
            border: 2px solid #444;
            color: #888;
            margin-top: 20px;
        }

        .back-btn {
            align-self: flex-start;
            background: rgba(30, 30, 30, 0.8);
            border: 2px solid #333;
            padding: 10px 20px;
            border-radius: 10px;
            color: #fff;
            margin-bottom: 30px;
            width: auto;
            font-size: 0.9rem;
        }

        .upload-box {
            width: 100%;
            border: 2px dashed #444;
            border-radius: 20px;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            background: rgba(20, 20, 20, 0.8);
        }

        .package-name {
            background: #111;
            border: 1px solid #333;
            padding: 8px 15px;
            border-radius: 8px;
            font-family: monospace;
            color: #ccc;
            margin-bottom: 20px;
            font-size: 0.9rem;
            word-break: break-all;
        }

        .upload-box h2 {
            margin-bottom: 10px;
            font-size: 1.3rem;
            text-align: center;
        }

        .upload-box p {
            color: #666;
            font-size: 0.9rem;
            margin-bottom: 30px;
            text-align: center;
        }

        .file-icon {
            font-size: 1.5rem;
            margin-right: 8px;
        }

        .file-loaded {
            margin-top: 15px;
            color: #00ff88;
            font-weight: bold;
            text-align: center;
            display: none;
            word-break: break-all;
            animation: fadeIn 0.3s ease;
        }

        /* BOTÃO DE INJETAR NOVAMENTE */
        #btn-reinject {
            display: none;
            background: #00ff88;
            color: #000;
            margin-top: 15px;
            border: 2px solid #00ff88;
            box-shadow: 0 0 15px rgba(0, 255, 136, 0.4);
        }

        #btn-reinject:active {
            background: #00cc6a;
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>

    <canvas id="canvas-bg"></canvas>

    <div class="container">
        
        <!-- TELA DE LOGIN -->
        <div id="screen-login" class="screen active">
            <div class="login-box">
                <h1 class="title-glow">ZANGADO</h1>
                <p class="subtitle">Painel Privado</p>
                <input type="password" id="password" placeholder="Digite a senha">
                <button onclick="goToPanel()">ENTRAR</button>
            </div>
        </div>

        <!-- TELA DE INJEÇÃO -->
        <div id="screen-panel" class="screen">
            <h1 class="title-glow">ZANGADO</h1>
            <p class="subtitle">Painel de Injeção</p>

            <div class="inject-btn" onclick="goToUpload('com.dts.freefireth', 'FF Normal')">
                <div class="icon-box">FF</div>
                <div class="inject-text">
                    <strong>Injetar no FF Normal</strong>
                    <span>com.dts.freefireth</span>
                </div>
            </div>

            <div class="inject-btn" onclick="goToUpload('com.dts.freefiremax', 'FF Max')">
                <div class="icon-box">MX</div>
                <div class="inject-text">
                    <strong>Injetar no FF Max</strong>
                    <span>com.dts.freefiremax</span>
                </div>
            </div>

            <button class="btn-outline" onclick="logout()">SAIR</button>
        </div>

        <!-- TELA DE UPLOAD -->
        <div id="screen-upload" class="screen">
            <button class="back-btn" onclick="goToPanel()">← Voltar</button>

            <div class="upload-box">
                <div class="package-name" id="target-package">com.dts.freefiremax</div>
                <h2 id="target-title">Injetar em FF Max</h2>
                <p id="upload-desc">Escolha o arquivo do seu celular</p>
                
                <button id="btn-select" onclick="selectFile()" style="display: flex; justify-content: center; align-items: center;">
                    <span class="file-icon">📁</span> SELECIONAR ARQUIVO
                </button>

                <!-- Nome do arquivo que vai aparecer -->
                <div id="loaded-file" class="file-loaded"></div>

                <!-- BOTÃO DE INJETAR NOVAMENTE (Só aparece após selecionar) -->
                <button id="btn-reinject" onclick="reinject()">INJETAR NOVAMENTE</button>
            </div>
        </div>

    </div>

    <script>
        // Variáveis globais para guardar o arquivo e pacote selecionados
        let currentFile = null;
        let currentPackage = "";

        // ============================================================
        // NAVEGAÇÃO DO PAINEL
        // ============================================================
        function goToPanel() {
            document.getElementById('screen-login').classList.remove('active');
            document.getElementById('screen-upload').classList.remove('active');
            document.getElementById('screen-panel').classList.add('active');
        }

        function goToUpload(packageName, title) {
            currentPackage = packageName;
            document.getElementById('target-package').innerText = packageName;
            document.getElementById('target-title').innerText = 'Injetar em ' + title;
            
            // Reseta a tela de upload (esconde arquivo antigo se existir)
            resetUploadScreen();

            document.getElementById('screen-login').classList.remove('active');
            document.getElementById('screen-panel').classList.remove('active');
            document.getElementById('screen-upload').classList.add('active');
        }

        function logout() {
            document.getElementById('password').value = "";
            currentFile = null;
            currentPackage = "";
            document.getElementById('screen-login').classList.remove('active');
            document.getElementById('screen-panel').classList.remove('active');
            document.getElementById('screen-upload').classList.remove('active');
            document.getElementById('screen-login').classList.add('active');
        }

        // ============================================================
        // RESETAR TELA DE UPLOAD
        // ============================================================
        function resetUploadScreen() {
            currentFile = null;
            document.getElementById('btn-select').style.display = 'flex';
            document.getElementById('upload-desc').innerText = 'Escolha o arquivo do seu celular';
            document.getElementById('loaded-file').style.display = 'none';
            document.getElementById('btn-reinject').style.display = 'none';
        }

        // ============================================================
        // SELECIONAR ARQUIVO E INJETAR
        // ============================================================
        function selectFile() {
            let fileInput = document.createElement('input');
            fileInput.type = 'file';
            fileInput.accept = '*/*'; 
            
            fileInput.onchange = function(e) {
                let file = e.target.files[0];
                if(file) {
                    currentFile = file; // Salva o arquivo na memória

                    // Atualiza a interface
                    document.getElementById('btn-select').style.display = 'none';
                    document.getElementById('upload-desc').innerText = 'Arquivo selecionado com sucesso!';
                    
                    let displayFile = document.getElementById('loaded-file');
                    displayFile.innerText = `✅ ${file.name}\nInjetando...`;
                    displayFile.style.display = 'block';

                    // Mostra o botão de reinjetar
                    document.getElementById('btn-reinject').style.display = 'block';

                    // Executa a injeção e abre o jogo
                    abrirJogo();
                }
            };
            fileInput.click();
        }

        // ============================================================
        // FUNÇÃO DE REINJETAR (Usa o arquivo já salvo na memória)
        // ============================================================
        function reinject() {
            if(currentFile) {
                let displayFile = document.getElementById('loaded-file');
                displayFile.innerText = `✅ ${currentFile.name}\nReinjetando...`;
                
                // Desabilita o botão temporariamente
                let btn = document.getElementById('btn-reinject');
                btn.innerText = "INJETANDO...";
                btn.style.opacity = "0.7";

                // Executa a injeção novamente
                abrirJogo();

                // Restaura o botão após 2 segundos
                setTimeout(() => {
                    btn.innerText = "INJETAR NOVAMENTE";
                    btn.style.opacity = "1";
                }, 2000);
            }
        }

        // ============================================================
        // ABRIR O JOGO (Lógica central)
        // ============================================================
        function abrirJogo() {
            setTimeout(() => {
                let deepLink = "";
                if (currentPackage === "com.dts.freefireth") {
                    deepLink = "freefire://";
                } else if (currentPackage === "com.dts.freefiremax") {
                    deepLink = "freefiremax://";
                }

                if (deepLink !== "") {
                    window.location.href = deepLink;
                    
                    // Se o jogo não abrir, avisa o usuário
                    setTimeout(() => {
                        document.getElementById('loaded-file').innerText = `✅ Injeção Concluída!\nToque em "INJETAR NOVAMENTE" para abrir o jogo.`;
                    }, 3000);
                }
            }, 1500);
        }

        // ============================================================
        // FUNDO ANIMADO (PARTÍCULAS)
        // ============================================================
        const canvas = document.getElementById('canvas-bg');
        const ctx = canvas.getContext('2d');
        let particles = [];

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }

        window.addEventListener('resize', () => {
            resizeCanvas();
            initParticles(); 
        });
        
        resizeCanvas();

        class Particle {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.size = Math.random() * 2 + 0.5;
                this.speedX = Math.random() * 1 - 0.5;
                this.speedY = Math.random() * 1 - 0.5;
                this.opacity = Math.random() * 0.5 + 0.1;
            }

            update() {
                this.x += this.speedX;
                this.y += this.speedY;
                if (this.x > canvas.width) this.x = 0;
                if (this.x < 0) this.x = canvas.width;
                if (this.y > canvas.height) this.y = 0;
                if (this.y < 0) this.y = canvas.height;
            }

            draw() {
                ctx.fillStyle = `rgba(255, 255, 255, ${this.opacity})`;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.shadowBlur = 10;
                ctx.shadowColor = 'white';
            }
        }

        function initParticles() {
            particles = [];
            const particleCount = Math.floor((canvas.width * canvas.height) / 15000); 
            for (let i = 0; i < particleCount; i++) {
                particles.push(new Particle());
            }
        }

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            let gradient = ctx.createRadialGradient(canvas.width/2, canvas.height/2, 0, canvas.width/2, canvas.height/2, canvas.width);
            gradient.addColorStop(0, "#111111");
            gradient.addColorStop(1, "#000000");
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            particles.forEach(particle => {
                particle.update();
                particle.draw();
            });

            ctx.shadowBlur = 0;
            requestAnimationFrame(animate);
        }

        initParticles();
        animate();

    </script>

  <script>
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("service-worker.js")
        .then(() => console.log("Service Worker registrado com sucesso!"))
        .catch((error) => console.error("Erro ao registrar Service Worker:", error));
    }
  </script>
</body>
</html>
